[project]
name = "fastapi-backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Margaux Bresson", email = "margauxbresson34@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "debugpy>=1.8.22",
    "elasticsearch>=9.5.1",
    "fastapi>=0.143.0",
    "requests>=2.34.2",
    "uvicorn>=0.54.0",
]
[tool.uv]
package = false

[project.scripts]
fastapi-backend = "fastapi_backend:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"
